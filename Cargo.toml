[package]
name = "rust-dtls"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

[profile.release]
lto = true
codegen-units = 1
